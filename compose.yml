name: adrobot

services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/adrobot.db
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command:
      - /bin/sh
      - -c
      - >-
        python -m venv /opt/venv &&
        /opt/venv/bin/pip install --no-cache-dir -r requirements.txt &&
        /opt/venv/bin/alembic upgrade head &&
        exec /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    volumes:
      - ./backend:/app:ro
      - database:/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6

  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://backend:8000
    command:
      - /bin/sh
      - -c
      - npm ci --no-audit --no-fund && exec npm run dev
    volumes:
      - ./frontend:/app:ro
      - frontend_dependencies:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  database:
  frontend_dependencies:
